<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'"><title>桌面工作情境</title><link rel="stylesheet" href="desktop-context.css"><script src="everything-result-columns.js" defer></script><script src="desktop-context-files.js" defer></script><script src="desktop-context-ui.js" defer></script></head><body>
<div id="desktop-context-icon" class="desktop-icon"><span class="icon-drag" title="拖曳邊緣移動">⠿</span><button id="icon-open" aria-label="展開桌面工作情境" title="工作情境：懸停展開，點擊操作">▦</button></div>
<main id="desktop-context-panel" hidden><header class="desktop-header"><strong>工作情境</strong><button id="desktop-pin" aria-pressed="false" title="固定展開（與置頂分開）" aria-label="固定展開">固定</button><button id="desktop-icon-mode" title="收成桌面圖示">▣</button><button id="desktop-hide" aria-label="隱藏桌面工作情境" title="隱藏（可從浮動工具或系統匣叫回）">×</button></header>
<div class="desktop-content"><label for="desktop-select">目前情境</label><select id="desktop-select" disabled><option value="">載入中…</option></select><p id="desktop-current"></p><div class="desktop-toolbar"><label class="topmost"><input id="desktop-topmost" type="checkbox" checked>保持置頂</label><button id="desktop-refresh">重新整理</button><button id="desktop-manage">管理情境</button></div><details class="context-display"><summary>顯示選項</summary><label><input id="desktop-keep-open" type="checkbox">保持展開</label><label>圖示大小（24–64px）<input id="desktop-icon-size" type="number" min="24" max="64" step="1" value="32"></label><button id="desktop-icon-save">套用大小</button><button id="desktop-icon-toolbar">桌面圖示</button><button id="desktop-toolbar-mode">面板模式</button><button id="desktop-compact">重設面板大小</button></details><p id="desktop-status" role="status" aria-live="polite"></p><section id="desktop-resources" aria-label="常用資源"></section><section id="desktop-detail" aria-label="資源內容" hidden></section><p class="desktop-hint">切換只預選資料，不改動搜尋與日曆範圍。懸停不會切換情境。</p></div></main>
</body></html>
