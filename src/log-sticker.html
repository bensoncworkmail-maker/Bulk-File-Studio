<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
 <title>桌面便條</title>
 <link rel="stylesheet" href="log-sticker.css">
 <script src="log-sticker-ui.js" defer></script>
</head>
<body>
 <header id="sticker-header">
  <span id="sticker-grip" class="drag-handle" aria-hidden="true" hidden><span></span></span>
  <div id="heading" role="button" tabindex="0" aria-controls="record" aria-expanded="true" aria-haspopup="menu"></div>
  <button id="close" type="button" aria-label="關閉並取消釘選" title="取消釘選">×</button>
 </header>
 <main id="record">
  <h1 id="title"></h1>
  <section id="draft-editor" aria-label="草稿正文" hidden>
   <textarea id="draft-body" rows="1" spellcheck="false" aria-label="草稿正文" placeholder="輸入草稿正文"></textarea>
   <div class="draft-status-row">
    <span id="draft-status" role="status"></span>
    <button id="recover-draft" class="sticker-link" type="button" hidden></button>
   </div>
  </section>
  <p id="notes"></p>
  <dl id="fields"></dl>
  <ul id="tag-items" hidden></ul>
  <section id="image-previews" aria-label="圖片預覽" hidden></section>
  <div id="attachments" hidden>
   <table>
    <caption id="attachment-hint" hidden></caption>
    <thead><tr><th scope="col">檔案名稱</th><th scope="col">所在位置</th></tr></thead>
    <tbody id="attachment-rows"></tbody>
   </table>
  </div>
  <div id="links" aria-label="相關網址" hidden></div>
 </main>
 <p id="status" role="status" hidden></p>
</body>
</html>
