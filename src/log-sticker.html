<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; form-action 'none'">
 <title>桌面便條</title>
 <link rel="stylesheet" href="log-sticker.css">
 <script src="log-sticker-ui.js" defer></script>
</head>
<body>
 <header>
  <span class="drag-handle" title="拖曳移動便條" aria-hidden="true"></span>
  <div id="heading" role="button" tabindex="0" aria-controls="record" aria-expanded="true"></div>
  <button id="close" type="button" aria-label="關閉並取消釘選" title="取消釘選">×</button>
 </header>
 <main id="record">
  <h1 id="title"></h1>
  <p id="notes"></p>
  <dl id="fields"></dl>
  <div id="links" aria-label="相關位置與網址" hidden></div>
  <div class="sticker-actions">
   <button id="visit" type="button"></button>
   <button id="locate" type="button" hidden>顯示所在位置</button>
  </div>
 </main>
 <p id="status" role="status" hidden></p>
</body>
</html>
