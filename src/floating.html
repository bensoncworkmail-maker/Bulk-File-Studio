<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'">
  <title>浮動工具</title>
  <link rel="stylesheet" href="floating.css">
  <script src="diagnostics-runtime.js"></script>
  <script src="floating-header.js" defer></script>
  <script src="floating.js" defer></script>
</head>
<body>
  <main id="mini-header" aria-label="浮動工具" title="拖曳空白處移動工具列">
    <span class="resize resize-left" data-resize="left" aria-hidden="true"></span>
    <button id="mini-focus" type="button" aria-pressed="false" title="切換專注模式">專注：關</button>
    <div id="mini-quick-actions" role="group" aria-label="浮動快捷動作"></div>
    <span class="resize resize-right" data-resize="right" aria-hidden="true"></span>
    <p id="mini-status" role="status" hidden></p>
  </main>
</body>
</html>
