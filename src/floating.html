<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'"><title>浮動收藏</title><link rel="stylesheet" href="floating.css"><script src="favorites-model.js" defer></script><script src="floating-header.js" defer></script><script src="floating.js" defer></script></head>
<body><header id="mini-header" tabindex="0" aria-label="浮動工具標題列，按右鍵或 Shift+F10 開啟工具選單" title="拖曳移動浮動工具"><span class="mini-resize-handle mini-resize-left" data-resize="left" aria-hidden="true"></span><span class="mini-resize-handle mini-resize-right" data-resize="right" aria-hidden="true"></span><span class="mini-drag-handle" aria-hidden="true">⠿</span><strong id="mini-heading">☆ 浮動收藏</strong><button id="mini-collapse" aria-label="收合浮動工具" title="收合／展開（F8）" aria-expanded="true">▴</button><button id="mini-tools-toggle" title="精簡／還原工具列" aria-pressed="false">▤</button><button id="mini-pin" title="切換浮動工具置頂" aria-pressed="true">置頂 ✓</button><button id="mini-main" title="在主視窗顯示目前標籤" aria-label="開啟主視窗">↗</button><button id="mini-close" aria-label="隱藏浮動收藏" title="隱藏；可從主視窗或全域快捷鍵叫出">✕</button></header><div id="mini-search-bar" class="mini-search"><input id="mini-search" type="search" maxlength="256" placeholder="搜尋收藏…" aria-label="搜尋收藏"><button id="mini-refresh" title="重新讀取檔案狀態">↻</button></div><div id="mini-tools-bar" class="mini-tools"><div class="mini-view-switch" role="group" aria-label="浮動收藏檢視"><button id="mini-view-list" aria-pressed="true" title="清單檢視">清單</button><button id="mini-view-icons" aria-pressed="false" title="圖示檢視">圖示</button><button id="mini-view-tags" aria-pressed="false" title="點標籤展開檔案選單">標籤</button></div><button id="mini-view-workspace" aria-pressed="false" title="釘選及搜尋工作區主紀錄">工作區</button><button id="mini-import" title="在主視窗貼上多行路徑，確認後匯入收藏">匯入路徑</button><button id="mini-copy-paths" title="複製目前篩選結果全部路徑，包含跨頁（Ctrl+Shift+C）">複製路徑清單</button><span id="mini-drop-hint">拖放檔案／資料夾以收藏</span></div><nav id="mini-tags" aria-label="標籤"></nav><div id="mini-list" aria-live="polite"></div><footer id="mini-pager"><span id="mini-count"></span><button id="mini-prev" aria-label="上一頁">‹</button><button id="mini-next" aria-label="下一頁">›</button></footer><div id="mini-drop" class="mini-drop" hidden>放開以收藏位置<br><small>套用目前選取的標籤</small></div><p id="mini-status" role="status">名稱開啟 · ⌖ 定位 · ⧉ 複製路徑 · Esc 隱藏</p></body></html>
