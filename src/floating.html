<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'"><script src="diagnostics-runtime.js"></script><title>浮動工具</title><link rel="stylesheet" href="floating.css"><link rel="stylesheet" href="floating-workspace.css"><link rel="stylesheet" href="floating-context.css"><script src="favorites-model.js" defer></script><script src="floating-header.js" defer></script><script src="layout-editor.js" defer></script><script src="floating-live-search.js" defer></script><script src="floating-render-guard.js" defer></script><script src="floating-panels-model.js" defer></script><script src="tool-views-ui.js" defer></script><script src="floating-panels.js" defer></script><script src="floating-clipboard-ui.js" defer></script><script src="floating-layout.js" defer></script><script src="floating-workspace-ui.js" defer></script><script src="floating-tool-layout.js" defer></script><script src="floating-tools-settings.js" defer></script><script src="everything-result-columns.js" defer></script><script src="desktop-context-files.js" defer></script><script src="desktop-context-ui.js" defer></script><script src="floating-tool-views.js" defer></script><script src="floating.js" defer></script><link rel="stylesheet" href="operation-ui.css"><script src="operation-ui.js" defer></script><link rel="stylesheet" href="graphite-theme.css"></head>
<body><main id="workspace-panel"><header id="mini-header" tabindex="0" aria-label="浮動工具標題列，按右鍵或 Shift+F10 開啟工具選單" title="拖曳移動浮動工具"><span class="mini-resize-handle mini-resize-left" data-resize="left" aria-hidden="true"></span><span class="mini-resize-handle mini-resize-right" data-resize="right" aria-hidden="true"></span><button id="mini-pin" title="切換浮動工具置頂" aria-pressed="true">置頂 ✓</button><button id="mini-focus" type="button" title="切換專注模式" aria-label="專注模式已關閉；點擊啟用" aria-pressed="false">專注：關</button><button id="mini-search-toggle" type="button" title="顯示／關閉搜尋面板（Ctrl+F）" aria-label="開啟搜尋面板" hidden>⌕</button><span class="mini-drag-handle" aria-hidden="true"></span><span id="mini-caption-bar" class="mini-header-caption"><strong id="mini-title">浮動工具</strong><span id="mini-heading">全部收藏</span></span><span class="mini-header-spacer" aria-hidden="true"></span><button id="mini-main" title="在主視窗顯示目前標籤" aria-label="開啟主視窗">↗</button><button id="mini-tools-toggle" title="精簡／還原工具列" aria-pressed="false">▤</button><button id="mini-context" title="桌面工作情境：圖示懸停展開、面板釘選" aria-label="開啟桌面工作情境">▦</button><button id="mini-draft" type="button" title="開啟草稿筆記" aria-label="開啟草稿筆記" hidden>✎</button><span id="mini-collapsed-actions" aria-label="收合時的快捷動作" hidden></span><button id="mini-collapse" aria-label="收合浮動工具" title="收合／展開（F8）" aria-expanded="true">▴</button><button id="mini-close" aria-label="隱藏浮動工具" title="隱藏；可從主視窗或全域快捷鍵叫出">✕</button></header><nav id="mini-command-bar" aria-label="浮動工具入口"><div id="mini-panels" role="group" aria-label="浮動內容分頁" hidden></div><div id="mini-quick-actions" class="mini-quick-actions" role="group" aria-label="浮動快捷動作" hidden></div></nav><div id="mini-search-bar" class="mini-search"><input id="mini-search" type="search" maxlength="256" placeholder="搜尋收藏…" aria-label="搜尋收藏"><button id="mini-global-search" type="button" title="全域搜尋：結果顯示於外部面板（Ctrl+Shift+F）">全域</button><button id="mini-refresh" title="重新讀取檔案狀態">↻</button></div><div id="mini-tools-bar" class="mini-tools"><div class="mini-view-switch" role="group" aria-label="浮動工具檢視"><button id="mini-view-list" aria-pressed="true" title="清單檢視">清單</button><button id="mini-view-icons" aria-pressed="false" title="圖示檢視">圖示</button><button id="mini-view-tags" aria-pressed="false" title="點標籤展開檔案選單">標籤</button></div><button id="mini-view-workspace" aria-pressed="false" title="釘選及搜尋工作區主紀錄">工作區</button><button id="mini-view-mixed" aria-pressed="false" title="收藏、標籤與工作區分區顯示">混合</button><button id="mini-import" title="在主視窗貼上多行路徑，確認後匯入收藏">匯入路徑</button><button id="mini-copy-paths" title="複製目前篩選結果全部路徑，包含跨頁（Ctrl+Shift+C）">複製路徑清單</button><span id="mini-drop-hint">拖放檔案／資料夾以收藏</span></div><nav id="mini-tags" aria-label="標籤"></nav><section id="mini-panel-content" aria-label="浮動內容" hidden></section><div id="mini-list" aria-live="polite"></div><footer id="mini-pager"><span id="mini-count"></span><button id="mini-prev" aria-label="上一頁">‹</button><button id="mini-next" aria-label="下一頁">›</button></footer><div id="mini-drop" class="mini-drop" hidden>放開以收藏位置<br><small>套用目前選取的標籤</small></div><p id="mini-status" role="status">名稱開啟 · ⌖ 定位 · ⧉ 複製路徑 · Esc 隱藏</p></main><dialog id="operation-dialog" class="operation-dialog" aria-labelledby="operation-title" aria-describedby="operation-detail"><span class="operation-spinner" aria-hidden="true"></span><h2 id="operation-title">正在處理…</h2><p id="operation-detail" role="status" aria-live="polite"></p><ul id="operation-list" hidden></ul></dialog>
<section id="floating-context-template" hidden>
<div id="desktop-context-icon" class="desktop-icon"><span class="icon-drag" title="拖曳邊緣移動">⠿</span><button id="icon-open" aria-label="展開桌面工作情境" title="工作情境：懸停展開，點擊操作">▦</button></div>
<main id="desktop-context-panel" hidden><header class="desktop-header"><strong>工作情境</strong><button id="desktop-pin" aria-pressed="false" title="固定展開（與置頂分開）" aria-label="固定展開">固定</button><button id="desktop-icon-mode" title="收成桌面圖示">▣</button><button id="desktop-hide" aria-label="隱藏桌面工作情境" title="隱藏（可從浮動工具或系統匣叫回）">×</button></header>
<div class="desktop-content"><label for="desktop-select">目前情境</label><select id="desktop-select" disabled><option value="">載入中…</option></select><p id="desktop-current"></p><div class="desktop-toolbar"><label class="topmost"><input id="desktop-topmost" type="checkbox" checked>保持置頂</label><button id="desktop-refresh">重新整理</button><button id="desktop-manage">管理情境</button></div><details class="context-display"><summary>顯示選項</summary><label><input id="desktop-keep-open" type="checkbox">保持展開</label><label>圖示大小（24–64px）<input id="desktop-icon-size" type="number" min="24" max="64" step="1" value="32"></label><button id="desktop-icon-save">套用大小</button><button id="desktop-icon-toolbar">桌面圖示</button><button id="desktop-toolbar-mode">面板模式</button><button id="desktop-compact">重設面板大小</button></details><p id="desktop-status" role="status" aria-live="polite"></p><section id="desktop-resources" aria-label="常用資源"></section><section id="desktop-detail" aria-label="資源內容" hidden></section><p class="desktop-hint">切換只預選資料，不改動搜尋與日曆範圍。懸停不會切換情境。</p></div></main>
</section></body></html>
