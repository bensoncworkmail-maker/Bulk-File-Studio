<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'"><script src="diagnostics-runtime.js"></script><title>浮動快捷表單</title><link rel="stylesheet" href="floating-capture.css"><script src="floating-capture-ui.js" defer></script></head>
<body><header><p class="eyebrow">浮動快捷</p><h1 id="capture-heading">正在開啟…</h1><p id="capture-context">在此填寫，先預覽再確認。</p></header>
<form id="capture-form"><main class="capture-scroll">
 <section id="capture-import" hidden><label>完整檔案／資料夾路徑，每行一項<textarea id="capture-text" rows="7" maxlength="2097152" spellcheck="false" placeholder="貼上完整路徑"></textarea></label></section>
 <section id="capture-record" hidden><label><span id="capture-title-label">紀錄名稱 *</span><input id="capture-title" type="text" maxlength="200"></label><div id="capture-fields"></div><details id="capture-extra"><summary>筆記與其他資料</summary><label>筆記<textarea id="capture-notes" rows="3" maxlength="100000"></textarea></label></details></section>
 <label>標籤，以逗號分隔<input id="capture-tags" type="text" placeholder="工作、合約"></label>
 <details id="capture-tag-picker"><summary>從現有標籤選取</summary><input id="capture-tag-search" type="search" placeholder="搜尋標籤…"><div id="capture-tag-options" class="capture-choice-list"></div><p id="capture-tag-empty" hidden></p><small>只列目前仍使用的標籤，排除回收筒；最多顯示 200 項，可搜尋全部標籤。快捷預設標籤請至設定修改。</small></details><details id="capture-locations" hidden><summary>連結檔案／資料夾位置</summary><div class="capture-location-tools"><button id="capture-add-file" type="button">選取檔案</button><button id="capture-add-folder" type="button">選取資料夾</button><button id="capture-clear-paths" type="button">清除新選位置</button></div><div id="capture-attachments"></div><input id="capture-favorite-search" type="search" placeholder="搜尋現有收藏位置…"><div id="capture-favorite-options" class="capture-choice-list"></div><small>最多顯示 200 項；搜尋全部收藏，已勾選的位置會保留。</small></details><details id="capture-paths" hidden><summary id="capture-path-count">拖放位置</summary><ul id="capture-path-list"></ul></details>
 <p id="capture-status" role="status" aria-live="polite">正在讀取…</p><span id="capture-spinner" class="spinner" aria-hidden="true" hidden></span>
 <section id="capture-preview" hidden aria-label="確認預覽"><h2>確認這次新增</h2><p id="capture-summary"></p><ul id="capture-preview-list"></ul></section>
 </main><footer><div id="capture-repeat-options" hidden><label><input id="capture-keep-values" type="checkbox" checked>連續新增時保留欄位與標籤</label><small>Ctrl+Enter：預覽／確認；Ctrl+Shift+Enter：儲存並新增</small></div><button id="capture-close" type="button">取消／關閉</button><button id="capture-check" type="submit" disabled>預覽</button><button id="capture-save-add" type="button" hidden disabled>儲存並新增</button><button id="capture-confirm" type="button" class="primary" disabled>確認儲存</button></footer>
</form></body></html>
