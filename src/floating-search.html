<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'"><title>全域搜尋</title><script src="diagnostics-runtime.js"></script><link rel="stylesheet" href="floating-search.css"><script src="floating-search-ui.js" defer></script></head>
<body><header><h1>全域搜尋</h1><form id="floating-search-form"><input id="floating-search-query" type="search" maxlength="256" placeholder="搜尋紀錄、電話、標籤或收藏位置…" aria-label="全域搜尋文字"><button type="submit">搜尋</button></form><div class="search-options"><select id="floating-search-kind" aria-label="搜尋結果類型"><option value="all">全部類型</option><option value="records">工作區紀錄</option><option value="paths">檔案／資料夾位置</option><option value="favorites">收藏</option><option value="tags">標籤</option><option value="structure">表格</option></select><label><input id="floating-search-related" type="checkbox">包含主從關聯</label></div><p id="floating-search-status" role="status" aria-live="polite">輸入文字開始搜尋。</p></header><main id="floating-search-results" aria-label="搜尋結果"></main><footer><small>搜尋本機已登記資料；不掃描磁碟、不啟用 Everything。Esc 關閉。</small><button id="floating-search-close" type="button">關閉</button></footer></body></html>
