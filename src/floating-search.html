<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; connect-src 'none'; frame-src 'none'; form-action 'none'; worker-src 'none'"><title>全域搜尋</title><script src="diagnostics-runtime.js"></script><link rel="stylesheet" href="floating-search.css"><script src="search-criteria.js"></script><script src="search-date-presets.js"></script><script src="floating-search-state.js"></script><script src="floating-search-ui.js" defer></script><link rel="stylesheet" href="graphite-theme.css"></head>
<body><header><h1>全域搜尋</h1><p id="floating-search-live-query" hidden></p><form id="floating-search-form"><input id="floating-search-query" type="search" maxlength="256" placeholder="搜尋紀錄、電話、標籤或收藏位置…" aria-label="全域搜尋文字"><button type="submit">搜尋</button></form><div class="search-options"><select id="floating-search-kind" aria-label="搜尋結果類型"><option value="all">全部類型</option><option value="records">工作區紀錄</option><option value="paths">檔案／資料夾位置</option><option value="favorites">收藏</option><option value="tags">標籤</option><option value="structure">表格</option></select><label><input id="floating-search-related" type="checkbox">包含主從關聯</label></div><div id="floating-date-presets" class="date-presets" role="group" aria-label="修改日期快捷範圍"></div><div id="floating-table-presets" class="date-presets" role="group" aria-label="表格勾選快捷"></div><details id="floating-search-filters" class="search-filters"><summary><strong>進階搜尋條件</strong><span id="floating-criteria-summary"></span></summary><div class="search-filter-body"><div class="search-options"><label>表格範圍 <select id="floating-criteria-tableMode"><option value="all">全部表格</option><option value="selected">指定主表／明細表</option></select></label><button id="floating-criteria-reset" type="button">恢復搜尋預設</button></div><div id="floating-criteria-tables" class="search-table-choices" hidden></div><div class="search-options"><label>修改日期由 <input id="floating-criteria-modifiedFrom" type="date"></label><label>至 <input id="floating-criteria-modifiedTo" type="date"></label></div><details><summary>來源及比對內容</summary><div id="floating-criteria-sources" class="search-options"></div><div class="search-options"><label><input id="floating-criteria-includeNotes" type="checkbox">筆記</label><label><input id="floating-criteria-includeTags" type="checkbox">標籤</label><label><input id="floating-criteria-includePaths" type="checkbox">已登記位置</label></div></details><small>條件會自動記住（不儲存搜尋文字）；恢復搜尋預設可回到設定頁的預設值。</small></div></details><small id="floating-search-save-status" role="status"></small><p id="floating-search-status" role="status" aria-live="polite">輸入文字開始搜尋。</p></header><main id="floating-search-results" aria-label="搜尋結果"></main><footer><small>搜尋本機已登記資料；不掃描磁碟、不啟用 Everything。Esc 關閉。</small><button id="floating-search-close" type="button">關閉</button></footer></body></html>
