<!doctype html>
<html lang="zh-Hant">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
 <title>草稿筆記 · Bulk File Studio</title>
 <link rel="stylesheet" href="draft-notes.css">
 <link rel="stylesheet" href="structured-note.css">
 <script src="structured-note-model.js" defer></script><script src="structured-note-ui.js" defer></script>
 <script defer src="resizable-split.js"></script><script defer src="draft-export-types.js"></script><script defer src="draft-notes-ui.js"></script>
</head>
<body>
 <header class="toolbar">
  <h1>草稿筆記</h1>
  <button id="new-draft" type="button" disabled>＋ 新草稿</button>
 </header>
 <main id="draft-layout" class="resizable-split">
  <nav id="drafts" aria-label="本機草稿"></nav>
  <section id="panel" aria-label="草稿編輯區">
   <p id="empty" hidden>選擇草稿，或按「新草稿」開始記錄。</p>
   <fieldset id="editor" disabled>
    <div class="title-row">
     <input id="title" maxlength="200" placeholder="標題（選填）" aria-label="草稿標題">
     <button id="save-as" type="button" title="Ctrl+Shift+S">另存檔案</button><button id="delete" type="button">刪除</button>
    </div>
    <div class="draft-type-row">
     <label>筆記類型 <select id="draft-type"><option value="text">文字</option></select></label>
     <span id="draft-type-hint" hidden></span>
    </div>
    <div id="draft-items" hidden></div>
    <div class="note-body-label"><span>內容 · 自動儲存</span><span id="char-count"></span></div><textarea id="body" spellcheck="false" placeholder="輸入筆記，或直接貼上圖片" title="拖曳右下角可調整編輯高度" aria-label="草稿內容"></textarea>
    <div id="draft-images" aria-label="筆記圖片" hidden></div>
    <section id="drop-zone" aria-label="草稿附件">
     <p>拖放檔案或資料夾到此視窗。貼上的 PNG 圖片會顯示在筆記內容下方。</p>
     <ul id="attachments" aria-label="附件清單"></ul>
    </section>
    <details id="draft-reminder"><summary>提醒排程（不必建立工作區紀錄）</summary><div class="draft-reminder-fields"><label>時間<input id="reminder-at" type="datetime-local"></label><label>重複<select id="reminder-repeat"><option value="none">一次</option><option value="daily">每天</option><option value="weekly">每週</option></select></label><button id="reminder-save" type="button">建立提醒</button></div></details>
    <details class="send-details" open><summary>送往資料工作區</summary><div class="destination">
     <label>送往工作區<select id="sheet"></select></label>
     <details id="draft-mapping" hidden><summary>對應工作區欄位</summary>
      <div class="draft-mapping-fields">
       <label id="draft-map-title-field">紀錄標題另存到<select id="draft-map-title"></select></label>
       <label id="draft-map-body-field">草稿正文另存到<select id="draft-map-body"></select></label>
       <label id="draft-map-items-field">清單／流程／時間軸<select id="draft-map-items"></select></label>
       <label id="draft-map-extraField-field">另填欄位<select id="draft-map-extraField"></select></label>
       <div id="draft-map-extra" hidden></div>
      </div>
      <p class="draft-transfer-hint">原有標題與正文會保留。表格只有一個同類欄位時，會自動選為清單目的欄位。</p>
     </details>
     <label id="master-field" hidden>主紀錄<select id="master"></select></label>
     <div class="destination-actions">
      <button id="refresh" type="button" title="重新讀取工作區表格及主紀錄">更新表格</button>
      <label class="reminder-choice"><input id="send-reminder" type="checkbox"> 建立後設定提醒</label>
      <button id="send" type="button" class="primary" disabled>建立紀錄</button>
     </div>
    </div></details>
   </fieldset>
  </section>
 </main>
 <dialog id="export-dialog"><form method="dialog"><h2>另存草稿</h2><p>以 UTF-8 純文字儲存；自訂副檔名不會轉成 Word／PDF 格式。</p><label>儲存類型<select id="export-type"></select></label><label id="export-custom" hidden>自訂副檔名<input id="export-extension" value="txt" maxlength="12" placeholder="例如：ini、yaml、sql"></label><div class="dialog-actions"><button value="cancel">取消</button><button id="export-confirm" type="button" class="primary">選擇位置並儲存</button></div></form></dialog>
 <dialog id="attachment-preview" aria-labelledby="attachment-preview-title"><header><strong id="attachment-preview-title"></strong><button id="preview-image-size" type="button" aria-pressed="false" hidden>原始大小</button><button id="preview-close" type="button">關閉預覽</button></header><div id="attachment-preview-content"></div></dialog>
 <footer>
  <span id="status" role="status" aria-live="polite">正在讀取草稿…</span>
  <span class="shortcut">Ctrl+N 新增 · Ctrl+S 儲存 · Esc 關閉</span>
 </footer>
</body>
</html>
