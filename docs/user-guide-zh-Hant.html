dth:18px;height:18px;accent-color:var(--guide-accent)}.guide-check-row button{flex:none}.guide-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}.guide-toc{position:sticky;top:16px;display:grid;gap:5px;max-height:80vh;overflow:auto}.guide-toc a{display:block;padding:7px 10px;border-radius:7px;color:var(--text,#3c4661);text-decoration:none;font-size:13px}.guide-toc a:hover{background:var(--surface-2,#ebe8fa)}.guide-chapter{scroll-margin-top:20px}.guide-chapter li{margin-bottom:10px;padding-left:3px}.guide-chapter p{margin:10px 0}.guide-tip{border-inline-start:3px solid #9c88ea;background:var(--surface-2,#f5f3fc);padding:12px 15px;border-radius:0 8px 8px 0}.guide-table-wrap{overflow:auto}.user-guide table{border-collapse:collapse;width:100%;font-size:14px}.user-guide :is(th,td){text-align:start;vertical-align:top;border:1px solid var(--line,#dce1ee);padding:10px 12px}.user-guide th{background:var(--surface-2,#f0eff9)}.user-guide pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2,#f0f2f8);padding:15px;border-radius:8px;font-size:13px}.user-guide [hidden]{display:none!important}.guide-empty{padding:30px;text-align:center}#user-guide-dialog{width:min(1280px,calc(100vw - 32px));height:calc(100vh - 40px);max-height:calc(100vh - 40px);padding:0;overflow:hidden}#user-guide-dialog[open]{display:flex;flex-direction:column}#user-guide-dialog>.guide-dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}#user-guide-dialog h2{margin:0}#user-guide-root{overflow:auto;width:100%}.guide-dialog-head .btn{flex:none}#function-finder-dialog{width:min(760px,calc(100vw - 32px))}.function-finder-results{display:grid;gap:8px;max-height:55vh;overflow:auto}.function-finder-result{text-align:start;display:grid;gap:3px;padding:12px!important}.function-finder-result small{font-weight:400;color:var(--muted)}
@media(max-width:760px){.user-guide{padding:14px}.guide-hero{padding:22px}.guide-layout{grid-template-columns:1fr}.guide-toc{position:static;max-height:220px;border:1px solid var(--line,#ddd);padding:8px;border-radius:10px}.guide-chapter,.guide-checklist{padding:17px}.guide-check-row{align-items:start}}

.user-guide{text-align:start}.user-guide :is(h1,h2,h3,p,li,pre){text-align:start}.user-guide ol{padding-inline-start:24px}.user-guide button{height:auto;min-height:34px;white-space:normal;line-height:1.5}.user-guide li{line-height:1.8}#user-guide-dialog{text-align:start}#user-guide-dialog h2{text-align:start}.user-guide pre{line-height:1.8}
</style></head><body><main id="user-guide-root"></main><noscript>請啟用瀏覽器 JavaScript 以閱讀本機指南；指南不需網路連線。</noscript><script>'use strict';
(() => {
 const version='1.140.0';
 const checklist=[
  ['appearance','調整字級與顯示密度','外觀與版面'],['favorite','收藏一個常用資料夾','檔案／資料夾收藏'],
  ['record','建立一筆工作區紀錄','主表、明細與紀錄'],['logs','從查看紀錄展開詳情','查看紀錄'],
  ['quick','設定一個浮動快捷動作','浮動工具與快捷動作'],['backup','建立第一份完整備份','備份／還原']
 ];
 const chapters=[
  {id:'start',title:'01｜第一次使用：十分鐘上手',feature:'外觀與版面',intro:'先從一個常用資料夾及一筆工作紀錄開始。這份指南不會自動新增、修改或刪除你的資料。',steps:['到「設定 → 外觀」調整主題、字級與密度；可先維持預設。','到「我的收藏 → 檔案與資料夾」收藏一個本機資料夾，再為它加上「工作」標籤。','到「資料工作區」建立主表或選用範本，加入一筆紀錄。','到「查看紀錄」選擇剛才的表格，按紀錄標題展開詳情。','最後到「工具箱 → 備份」建立完整備份。'],tip:'資訊頁「快速找功能」（Ctrl+K）可搜尋功能入口；「使用指南」（F1）可隨時回來。本頁勾選清單只記錄學習進度，不會代替實際操作。'},
  {id:'map',title:'02｜先認識三種資料',intro:'位置收藏、工作區內容及 Everything 追蹤各有用途，可以在同一個 app 內搭配使用。',table:[['資料','用途','例子'],['檔案與資料夾收藏','記住實際位置，原檔案仍在磁碟','常用合約資料夾、報表檔案'],['工作區紀錄與表格','儲存欄位、筆記及主從關係','客戶、專案、跟進紀錄'],['Everything 追蹤','儲存搜尋式並更新符合的檔案清單','最近 7 天修改的大型影片']],tip:'移除一般收藏不等於刪除原始檔案；資源回收筒、改名及搬移則是另一種實際檔案操作，請留意確認畫面的範圍。'},
  {id:'home',title:'03｜首頁與快速找功能',feature:'資訊與更新紀錄',steps:['首頁可查看最近收藏、最近修改紀錄、主表及 Everything 追蹤摘要。','用首頁搜尋查找 app 內資料；找不到某項工具時，展開「功能導覽」或按 Ctrl+K。','在「快速找功能」輸入「共享」「副檔名」「備份」等關鍵字，選擇入口。沒有輸入時按 Enter 不會自動跳轉。','按「編輯版面」可移動首頁區塊、調整尺寸，完成後退出編輯；「自訂首頁」可選擇顯示區塊。'],tip:'功能搜尋用來找入口；全域搜尋用來找內容；Everything 用來找本機索引中的檔案。'},
  {id:'favorites',title:'04｜檔案與資料夾收藏',feature:'檔案／資料夾收藏',steps:['按「＋ 檔案」或「＋ 資料夾」選擇本機位置，也可用「匯入路徑」貼上每行一個的完整路徑。','加入標籤後，可從左側標籤縮小範圍，再用名稱、路徑、類型與狀態篩選。','單擊選取；雙擊名稱開啟、雙擊位置定位。先選取項目，再使用開啟、標籤或更多操作。','從「更多操作」處理批次開啟、複製及重新連結；遺失位置請先確認檔案是否被移動。','設定 → 收藏與標籤可調整初始分頁及記住上次分頁。預設優先還原上次選取的分頁。'],tip:'一般收藏、批次改名及搬移以本機磁碟為範圍。工作區位置連結及指定共享資料包有不同的網路路徑規則。'},
  {id:'workspace',title:'05｜工作區：主表、明細與紀錄',feature:'主表、明細與紀錄',intro:'主表是一組資料的入口；主紀錄代表一個客戶或專案；明細表放置屬於它的多筆資料。一般表格也可獨立使用。',steps:[ '回收紀錄時可勾選一併回收引用的實際檔案。第二次確認會列出可回收路徑及保留原因。沒有可回收的檔案時，可選擇只回收紀錄。其他紀錄或草稿仍引用的檔案、獨立收藏、資料夾及網路位置會保留。若需還原已回收的檔案，請使用系統資源回收筒。','從「資料工作區」新增「主表」或從範本建立，為表格設定名稱。','新增需要的欄位，例如文字、日期、狀態、路徑或網址；再按「＋ 紀錄」輸入內容並儲存。','需要一對多資料時建立明細表，例如一位客戶的多筆跟進；建立紀錄前確認目前選取的主紀錄。','在清單、卡片與表格之間切換；可儲存常用檢視、篩選條件及欄位版面。','紀錄詳情可加入筆記、檔案位置與連結。需要批次編輯時先核對勾選範圍。'],example:'例子：主表「客戶」→ 主紀錄「示範公司」→ 明細表「跟進」→ 紀錄「致電確認交期」。',tip:'變更表格名稱後，資料關聯依原有識別維持。共享接收仍應使用原來源設定，並逐項檢查差異預覽。'},
  {id:'logs',title:'06｜查看紀錄、詳情與提醒',feature:'查看紀錄',steps:['開啟「查看紀錄」，在精簡搜尋列選擇表格並輸入關鍵字；浮窗將搜尋、表格及主紀錄選單固定並排，展開下拉可看完整選項；「更多篩選」可設定日期與狀態，「檢視」可選清單／卡片及排序。','按紀錄標題、展開箭頭或項目空白處，在此頁展開／收合詳情。標題不會直接帶你離開此頁。已套用條件會顯示成可移除的篩選標籤，日期亦可快速選今天、最近 7 天或本月。','詳情內會顯示欄位、筆記、標籤與修改日期；按「提醒」為這筆紀錄建立提醒。','需要完整編輯時，按詳情內的「前往工作區」。浮動紀錄的釘選項目仍可使用編輯與取消釘選。','設定 → 日曆與紀錄可調整預設範圍、摘要行數與顯示選項。浮動速覽可釘選常用紀錄並只看釘選。'],tip:'選取文字或操作詳情內按鈕不會收合卡片。頁面留白與卡片內距讓標題及內容更容易閱讀。'},
  {id:'everything',title:'07｜Everything：先設定，再搜尋',feature:'啟動與 Everything 整合',intro:'此整合僅適用 Windows，需先安裝並執行 Everything，且為 ES 命令列工具設定正確位置。',steps:['確認 Everything 本身能搜尋到目標檔案；內網共享位置需先在 Windows 連線，並已加入 Everything 索引。','到「設定 → 啟動」選取 es.exe 並啟用 Everything 整合。','到「Everything 追蹤」按「＋ 追蹤搜尋」，輸入名稱、搜尋條件、語法模式及類型。','可先套用搜尋預設，再追加日期、大小、檔名、路徑或屬性條件。使用語法／regex 時留意目前模式。','以類型選擇器限制影片、文件等分類；也可輸入副檔名並儲存成具名自訂類型。'],example:'ext:pdf;docx;xlsx dm:last7days\n\n搜尋最近 7 天修改的 PDF、Word 與 Excel 文件，適合找回近期處理的合約或報表。類型選「檔案及資料夾」或「只有檔案」，避免疊加其他類型限制。想排除某資料夾時，可在快速條件輸入完整路徑並按「排除此資料夾」。',tip:'快速條件通常是追加；「套用預設（取代條件）」會替換目前搜尋文字，按下前先看清楚。相對日期會在每次查詢時重新計算。'},
  {id:'tracking',title:'08｜Everything 追蹤結果操作',feature:'Everything 追蹤',steps:['在追蹤搜尋標籤上按右鍵，或聚焦後按 Shift+F10／選單鍵，可查看、新增搜尋、重新命名及刪除標籤。新增搜尋會預填該標籤；改成已有名稱時合併標籤；新名稱不可包含半形或全形逗號。刪除前確認影響數量，搜尋命令與實際檔案保留；全部追蹤與未加標籤是內建篩選，無法改名或刪除。','設定 → 收藏 → Everything 啟動時選取的追蹤搜尋預設為上次選取項目；也可指定固定搜尋。項目已移除或不在選取標籤時改選第一項。','左側記住目前選取的追蹤項目及標籤，包含全部追蹤、未加標籤及具名標籤，重新啟動後還原；已不存在的具名標籤會退回全部追蹤。','「立即更新」查詢目前搜尋。「暫停追蹤／恢復追蹤」直接儲存啟用狀態，重啟後保留。','本機檔名前顯示 Windows 系統圖示；捷徑會讀取指定圖示或目標並加上捷徑標記。資料夾固定使用黃色圖示，圖示載入失敗時保留一般圖示。單擊列選取；Ctrl 點擊增減選取；Shift 點擊選取範圍時不會同時反白文字；平常仍可用滑鼠拖曳選取文字。雙擊名稱開啟，雙擊所在位置定位。','按 Ctrl+F 可聚焦並選取篩選文字。在「篩選目前結果」輸入檔名或路徑，空格分隔的關鍵字須全部符合；只篩選目前最多 500 項，不修改 Everything 搜尋命令或重新查詢。本次使用期間，每個追蹤保留自己的篩選文字；修改篩選會清除選取，Ctrl+A 只選目前顯示的結果。按「清除篩選」還原整份清單。說明可從旁邊的 ⓘ 圖示懸停、聚焦或點擊閱讀，按 Esc 關閉。','大小單位可選自動、bytes、KB、MB、GB，會跨重啟記住；KB／MB／GB 以 1024 換算。大小排序仍按原始 bytes，複製表格使用畫面所選單位。設定 → 收藏可調整單位、系統檔案圖示及複製操作欄。','點欄名切換升降冪；每個搜尋記住排序與各欄方向。右鍵欄名選擇額外欄位或調整適合內容的欄寬；「複製（操作欄）」可獨立顯示／隱藏並記住，也可從「選擇欄位」調整；拖曳欄位分隔線可自訂寬度。','選取後使用複製路徑、檔名、所在資料夾或「複製所選表格」。表格按目前可見欄位與畫面排序輸出，貼到試算表即可分欄。','更新時間、結果數量、收合工具按鈕、定時更新摘要與已選數量共用一列，窄視窗自動換行。收合操作工具會一起隱藏定時更新設定，重啟後記住；「所選項目操作」仍可使用。','內網 UNC 共享與 Windows 對應磁碟可顯示已索引的檔案及資料夾；UNC 會先驗證主機及實際存取權，資料夾使用黃色圖示，共享檔案使用一般圖示。共享結果可開啟、定位、複製及收藏；改名、搬移或回收請使用檔案總管。無法存取的位置會在更新列顯示略過原因。','定時更新只處理目前顯示的搜尋，勾選結果或開啟對話框時暫停。快取只在本次執行保留，每個搜尋最多 500 項。'],tip:'批次開啟會先確認，每次最多 20 個目標。F2 或「重新命名」只處理一項，預設直接在檔名儲存格編輯；檔案先選取不含副檔名的名稱，資料夾選取完整名稱。Enter 確認、Esc 或離開欄位取消；完成後立即顯示新名稱與路徑，下次更新再按原搜尋條件比對；失敗時保留輸入並在欄位下方顯示原因。設定 → 收藏的「單項重新命名方式」可切回對話框，重啟後記住；多檔改名及搬移仍進入既有預覽。Delete 或「移至資源回收筒」會列出來源並要求確認，包含資料夾內的內容；相關一般收藏連結會一併移除，工作區文字路徑保留。成功回收後只移除已回收的結果，其餘結果仍保留；若重新查詢失敗，也會保留剩餘清單並顯示原因。每批最多 5000 個項目（含子項目），回收失敗會保留來源，不會改為永久刪除。未提供的額外欄位顯示 —，可能與 ES 版本或索引設定有關。'},
  {id:'search',title:'09｜全域搜尋與內容收藏',feature:'全域搜尋',steps:['全域搜尋可查工作區紀錄、收藏、檔案連結、標籤及其他 app 內資料。使用範圍、日期及欄位條件縮小結果。','我的收藏的「工作區紀錄與表格」分頁保存內容收藏；單筆收藏及整表同步用途不同。','整表同步會依來源表格內容反映紀錄，標籤與排除規則由同步設定管理。','從結果開啟紀錄詳情，確認目標後再修改；需要查磁碟上尚未收藏的檔案，改用 Everything。']},
  {id:'planning',title:'10｜日曆、看板與提醒排程',feature:'日曆／看板',steps:['同一筆紀錄的跟進日期與下次跟進若為同一天，日曆只顯示一個項目，並列出兩個欄位名稱；不同日期及提醒仍分開顯示。','在資料工作區先建立日期或狀態欄位並填入紀錄內容。','日曆／看板選擇資料範圍、日期欄位或狀態欄位；日曆按時間瀏覽，看板按狀態分組。','從查看紀錄的詳情或紀錄操作建立提醒，再到「提醒排程」查看到期、延後或完成狀態。','若未出現通知，檢查 app 是否執行、提醒是否暫停，以及 Windows 的通知設定。'],tip:'日期欄位顯示在日曆不等於已建立提醒；提醒需要另外設定。'},
  {id:'floating',title:'11｜浮動工具、快捷鍵與專注',feature:'浮動工具與快捷動作',steps:['按頂端「浮動工具」開啟；設定 → 浮動工具或浮窗內齒輪可選入口模式與六個工具的顯示位置；固定展開與置頂分開設定，Dock 可選四邊及點擊／懸停。獨立面板各自保存位置、尺寸，恢復開關預設關閉。','懸浮球收合只顯示完整 B，可直接拖曳；點 B 展開／收合。啟用自動收合後，離開或失焦會收合；固定面板、對話框與正在操作時除外。側列與 Dock 和面板保持間距；⋯ 更多操作保留專注、置頂、主視窗及原有快捷動作。','新增具名快捷動作，可指定表格、Everything 追蹤或常用文字等目標，再設定是否顯示及快捷鍵。','文字片段先建立分類與內容；在外部程式貼上前，先把游標放在要輸入的位置，再使用對應快捷鍵。','設定 → 快捷鍵可檢查重複綁定。啟用專注模式後，只註冊標示為「專注時保留」的全域快捷鍵。','預設 Ctrl+Alt+Shift+F 切換專注模式；浮動工具也會顯示目前狀態，實際按鍵以你的設定為準。'],tip:'「複製」與「立即貼上」是兩種操作。若目標程式焦點已改變，請回到輸入位置重試，或複製後手動貼上。'},
  {id:'drafts',title:'12｜草稿、常用文字與情境工作集',feature:'草稿筆記',steps:['草稿適合隨手記錄，文字會自動儲存；可加入附件、預覽或轉成工作區紀錄。','工作區新增／編輯紀錄時，可在筆記或多行文字欄按 Ctrl+V 貼上 PNG。圖片顯示於筆記分頁，可放大或移除；每次編輯最多加入 8 張、每張 5 MB、寬高各 4096 像素。儲存紀錄後才保存新圖片，取消不會寫入。已保存圖片只解除連結，避免影響其他紀錄或歷史；完整備份會封裝貼上的圖片。','常用文字片段用分類管理固定回覆，可匯入、複製或指定快捷鍵貼上。','情境工作集集中一組檔案、資料夾與工作區紀錄，方便開始某個任務時開啟相關內容。','先以少量項目測試，再擴大批次開啟範圍。']},
  {id:'files',title:'13｜批次改名、搬移與路徑修復',feature:'檔案工具',steps:['從檔案工具加入檔案，或由收藏／追蹤將已選項目送入批次改名或搬移。','設定命名規則或目的地，先讀取預覽中的原路徑、新路徑、衝突與不可執行原因。','確認預覽無誤後才執行。第一次練習請使用測試檔案。','需要復原時使用上一批改名／搬移的復原功能；檔案身分不符時會停止。','大量路徑變更可用「工具箱 → 批次修復路徑」預覽收藏與工作區連結的前綴替換。'],tip:'上一批改名／搬移的復原仍保留；作業中心已移除。請為原始文件另做備份。路徑修復更新引用，並不等於搬移磁碟上的檔案。'},
  {id:'transfer',title:'14｜匯入、匯出與共享差異',feature:'工作區匯入與匯出',steps:['匯入前先建立備份，再選擇 Studio JSON、Excel 或表格文字等來源。','在預覽中確認表格、欄位對應、資料筆數，以及新增／更新／合併模式。','共享來源可按範圍設定發布與接收，使用原來源設定及授權；不同來源的範圍應分別核對。','接收共享更新時讀取三方差異，對衝突逐項決定，確認後才套用。','若來源不可用，先檢查指定資料夾、授權、網路連線及資料包版本，避免另建重複來源。'],tip:'本機開啟檔案的授權與匯入的路徑文字分開處理。不要把設定匯出當成完整資料備份。'},
  {id:'backup',title:'15｜備份、還原與設定',feature:'備份／還原',steps:['到「工具箱 → 備份」按「建立完整備份」，確認備份清單出現新項目。','需要帶走備份時匯出所選項目，保存到另一個可靠位置。','還原時先選擇備份並檢查預覽中的範圍、筆數與版本，再按確認還原。','設定可按分類還原；只想調整外觀時，不需要重設所有設定。','草稿檔案會嘗試封裝，紀錄歷史及文件可選包含；先檢查涵蓋清單與未封裝原因。共享授權及系統登記另行管理。'],tip:'完整備份包含 app 資料與工具設定，但不是整部電腦或全部原始文件的備份。'},
  {id:'keys',title:'16｜常用快捷鍵速查',table:[['情境','按鍵','動作'],['主視窗','F1 / Ctrl+K','使用指南／快速找功能'],['主視窗','Ctrl+Shift+F','全域搜尋頁'],['Everything 結果','Ctrl+A / Ctrl+Shift+A','全選／反向選取'],['Everything 結果','Ctrl+C / Ctrl+Shift+C','複製路徑／檔名'],['Everything 結果','F2 / F5','單項重新命名／立即更新'],['Everything 結果','Enter / Ctrl+Enter','批次開啟／開啟所在資料夾'],['Everything 結果','Ctrl+Shift+M / Esc','搬移預覽／取消選取'],['紀錄表單','Ctrl+Enter','儲存'],['草稿','Ctrl+S / Esc','儲存／儲存並關閉']],tip:'快捷鍵依目前頁面與輸入焦點生效。輸入文字、開啟其他對話框或專注模式時可能不同；可自訂按鍵以設定頁為準。'},
  {id:'workflow',title:'17｜工具箱與桌面工作情境',feature:'情境包',steps:['從頂部「更多」開啟工具箱，保留情境包、參數範本、追蹤變更、離線 OCR 及備份。其他工具有路徑修復、整理規則、文件預覽。','情境包連結主紀錄及常用資源。點頂端情境、浮動工具入口或系統匣，開啟工作情境；設定 → 浮動工具可選桌面浮動或程式內面板。','桌面圖示預設 32px，顯示選項可設 24–64px 或保持展開。追蹤檔案改用緊湊清單，可搜尋、每頁 50 項、直接開啟或在更多操作定位及複製。','參數範本先預覽再複製；追蹤變更核對後標示已讀。OCR 校正後直接存入草稿筆記。','備份前檢查涵蓋清單，還原前可先試還原。'],tip:'工作情境暫時與浮動工具分開；主表彙總、重複檔分析、檔案比較、自動流程及收件匣已移除。既有草稿與備份資料保留，舊自動流程不再執行。Windows 原生行為仍需實機驗收。'},
  {id:'faq',title:'18｜常見問題與排查',table:[['遇到的情況','先檢查什麼'],['Everything 沒有結果','Everything 本身能否查到、es.exe 路徑、整合是否啟用、搜尋條件及類型；內網共享再檢查連線、權限與更新列的略過原因'],['追蹤沒有自動更新','是否目前可見、是否暫停、更新間隔、已選結果或對話框'],['看不到工作區紀錄','目前主紀錄、表格、篩選條件、日期及回收筒'],['想看詳情卻不想離開頁面','在查看紀錄按標題展開；編輯時才按前往工作區'],['收藏位置遺失','原檔案是否改名或搬移；先定位，再重新連結或批次修復'],['外部程式貼上失敗','輸入焦點是否仍在目標程式；可改用複製後手動貼上'],['共享更新失敗','來源授權、路徑、資料包版本與差異衝突'],['不小心改了版面','設定分類還原或首頁版面還原；還原前確認影響範圍']],tip:'回報問題時提供 app 版本、所在頁面、操作步驟與錯誤文字即可。請先遮蔽個人資料及敏感路徑。'}
 ];
 function search(text=''){const words=String(text).trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);return chapters.filter(chapter=>words.every(word=>JSON.stringify(chapter).toLocaleLowerCase().includes(word)));}
 function progress(input){return Array.isArray(input)?checklist.map(([id])=>id).filter(id=>input.includes(id)):[];}
 const model={version,checklist,chapters,search,progress};if(typeof module!=='undefined'&&module.exports)module.exports=model;else window.userGuideModel=Object.freeze(model);
})();

  for(const [id,text,feature] of M.checklist){const row=node('div',undefined,'guide-check-row'),label=node('label'),check=node('input');check.type='checkbox';check.checked=completed.includes(id);check.setAttribute('aria-label',text);checks.push([id,check]);check.addEventListener('change',()=>{completed=M.progress(checks.filter(([,el])=>el.checked).map(([id])=>id));persist();});label.append(check,node('span',text));row.append(label);if(openFeature)row.append(button('前往操作',()=>openFeature(feature)));checklist.append(row);}checklist.append(progress,button('重設學習進度',()=>{completed=[];for(const [,check] of checks)check.checked=false;persist();}));update();
  const layout=node('div',undefined,'guide-layout'),toc=node('nav',undefined,'guide-toc'),content=node('div',undefined,'guide-content');toc.setAttribute('aria-label','指南章節');const cards=new Map(),links=new Map();
  for(const chapter of M.chapters){const link=node('a',chapter.title);link.href='#guide-'+chapter.id;link.addEventListener('click',event=>{event.preventDefault();const card=cards.get(chapter.id);if(!card||card.hidden)return;const heading=card.querySelector('h2');heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});card.scrollIntoView({block:'start'});});toc.append(link);links.set(chapter.id,link);const article=node('section',undefined,'guide-chapter');article.id='guide-'+chapter.id;article.append(node('h2',chapter.title));if(chapter.intro)article.append(node('p',chapter.intro));if(chapter.steps){const list=node('ol');for(const step of chapter.steps)list.append(node('li',step));article.append(list);}if(chapter.table){const wrap=node('div',undefined,'guide-table-wrap'),table=node('table');table.setAttribute('aria-label',chapter.title);chapter.table.forEach((cells,index)=>{const row=node('tr');for(const value of cells){const cell=node(index===0?'th':'td',value);if(index===0)cell.setAttribute('scope','col');row.append(cell);}table.append(row);});wrap.append(table);article.append(wrap);}if(chapter.example)article.append(node('pre',chapter.example));if(chapter.tip)article.append(node('p',chapter.tip,'guide-tip'));if(openFeature&&chapter.feature)article.append(button('前往：'+chapter.feature,()=>openFeature(chapter.feature)));cards.set(chapter.id,article);content.append(article);}
  const empty=node('p','找不到符合的章節，請試試其他關鍵字或清除搜尋。','guide-empty');content.append(empty);layout.append(toc,content);root.replaceChildren(intro,toolbar,checklist,layout);root.classList.add('user-guide');
  function filter(){const ids=new Set(M.search(search.value).map(chapter=>chapter.id));for(const [id,card] of cards){card.hidden=!ids.has(id);links.get(id).hidden=card.hidden;}empty.hidden=ids.size>0;count.textContent=ids.size+'／'+M.chapters.length+' 個章節';}
  search.addEventListener('input',filter);filter();return {focus:()=>search.focus()};
 }
 window.userGuideUI=Object.freeze({mount});
})();

window.userGuideUI.mount(document.getElementById('user-guide-root'));
</script></body></html>
